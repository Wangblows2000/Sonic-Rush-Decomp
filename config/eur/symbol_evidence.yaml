# Evidence for every non-default symbol name in config/eur/arm9/**/symbols.txt.
#
# confidence:
#   confirmed  - fixed by ROM metadata or a byte-exact match against code whose
#                name is known (e.g. a matched SDK function).
#   strong     - multiple independent indicators, or a published signature.
#   tentative  - plausible guess from one indicator. Must be revisited.
# Default dsd names (func_XXXXXXXX, data_..., bss_...) mean "unknown" and need
# no entry. `tools/project.py symbols` reports names without an entry as
# tentative.

# --- ROM / module metadata ----------------------------------------------------
Entry:
  confidence: confirmed
  evidence: "ARM9 entry address in ROM header (0x024) = 0x02000800."
AutoloadCallback:
  confidence: confirmed
  evidence: "ARM9 autoload-done callback in ROM header (0x070) = 0x02000a10."
BuildInfo:
  confidence: confirmed
  evidence: >-
    NitroSDK module parameters at ARM9+0xB00: autoload list 0x02086880-0x02086898,
    BSS 0x0207cfe0-0x022c5c80, SDK version 0x02017532, magic 0xdec00621.
main:
  confidence: strong
  evidence: "dsd entry-point analysis: function reached from Entry's crt0 tail."

