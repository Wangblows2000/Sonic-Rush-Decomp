VBlankIntrWait: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
CpuSet: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
BitUnPack: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
HuffUnCompReadByCallback: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
