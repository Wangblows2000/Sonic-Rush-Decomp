Halt: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
IntrWait: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
Sqrt: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
SoftReset: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
LZ77UnCompReadByCallbackWrite16bit: {confidence: strong, evidence: "dsd secure-area SWI stub analysis"}
