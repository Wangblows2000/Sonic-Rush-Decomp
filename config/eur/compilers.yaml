# Compiler configuration for Sonic Rush (EUR).
#
# STATUS (2026-11-15): CodeWarrior for NINTENDO DS **1.2** family verified for
# main-module game/SDK code: 8 reconstructed functions (ARM and Thumb) match
# byte-for-byte on 1.2/base, sp2, sp2p3, sp3 and sp4, and 3 of them fail on
# 1.2/b56 and every 2.0 release (tools/matching/compiler_sweep.py,
# docs/research/0004-compiler.md). The exact service pack is not yet
# distinguished; sp3 is used as the working default.
#
# Path globs are matched in order; first match wins.

default:
  # Sonic Rush shipped Nov 2005 with NitroSDK 2.1 (build-info version
  # 0x02017532). CodeWarrior for NINTENDO DS 2.0 is the toolchain the sister
  # game Sonic Rush Adventure (2007, NitroSDK 3.x) matches with; Rush
  # predates it, so CW 1.2 service packs are the first candidates.
  version: "1.2/sp3"
  status: verified-family   # 1.2 base..sp4 all match; SP undetermined
  candidates: ["1.2/base", "1.2/sp2", "1.2/sp2p3", "1.2/sp3", "1.2/sp4"]
  ruled_out: ["1.2/b56", "2.0/base", "2.0/sp1", "2.0/sp1p5", "2.0/sp2p2"]
  flags: >-
    -O4,p -proc arm946e -enum int -char signed -gccext,on
    -fp soft -interworking -sym on -gccinc -nolink
    -msgstyle gcc -w off -lang c99 -Cpp_exceptions off
  evidence: >-
    Flags taken from Sonic Rush Adventure decomp (same Dimps engine lineage)
    and zeldaret/ph; not yet tested against Sonic Rush code.

rules:
  - glob: "libs/NitroSDK/**"
    version: "1.2/sp2p3"
    status: unverified
    evidence: "SRA builds NitroSDK with 1.2/sp2p3; SDK release used by Rush differs."
    flags: >-
      -O4,p -proc arm946e -enum int -char signed -gccext,on -fp soft
      -inline on,noauto -interworking -sym on -gccinc -nolink -msgstyle gcc
      -w off -lang c99
  - glob: "libs/NitroSystem/**"
    version: "1.2/sp4"
    status: unverified
    evidence: "SRA builds NitroSystem with 1.2/sp4."
    flags: >-
      -O4,p -proc arm946e -enum int -char signed -gccext,on -fp soft
      -inline on,noauto -interworking -sym on -gccinc -nolink -msgstyle gcc
      -w off -lang c99

linker:
  version: "1.2/sp3"
  status: verified          # full ROM link reproduces SHA-1 52e5024e...
  flags: "-proc arm946e -nostdlib -interworking -nodead -map closure,unused -msgstyle gcc"
