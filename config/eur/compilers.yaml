# Compiler configuration for Sonic Rush (EUR).
#
# STATUS (2026-11-16): CodeWarrior for NINTENDO DS 1.2/sp2 is the verified
# compiler for all ARM9 code (main, ITCM, ov000, ov001): every C translation unit
# in the build matches with the default flags below (per-file overrides via a
# `// flags:` first line). sp2 is the only build that reproduces the Thumb switch
# tables; sp3/sp4 emit `ldm {pc}` epilogues. The linker is 1.2/sp3.
# History: docs/research/0004-compiler.md.
#
# Path globs are matched in order; first match wins.

default:
  # Sonic Rush shipped Nov 2005 with NitroSDK 2.1 (build-info version
  # 0x02017532). CodeWarrior for NINTENDO DS 2.0 is the toolchain the sister
  # game Sonic Rush Adventure (2007, NitroSDK 3.x) matches with; Rush
  # predates it, so CW 1.2 service packs are the first candidates.
  version: "1.2/sp2"
  status: verified          # 1.2/sp2: Thumb switch tables (ldrh; add r0,pc; bx r0) only match sp2; sp3+ ldm {pc} epilogues ruled out
  candidates: ["1.2/base", "1.2/sp2", "1.2/sp2p3", "1.2/sp3", "1.2/sp4"]
  ruled_out: ["1.2/b56", "2.0/base", "2.0/sp1", "2.0/sp1p5", "2.0/sp2p2"]
  flags: >-
    -O4,p -proc arm946e -enum int -char signed -gccext,on
    -fp soft -interworking -sym on -gccinc -nolink
    -msgstyle gcc -w off -lang c99 -Cpp_exceptions off
  evidence: >-
    Verified: every C TU in the ROM build matches with these flags (base flags
    from the Sonic Rush Adventure decomp and zeldaret/ph; -Cpp_exceptions off
    added to suppress .exceptix sections).

# Per-path overrides (none needed: no libs/ split exists; per-file `// flags:` is used instead).
rules: []

linker:
  version: "1.2/sp3"
  status: verified          # full ROM link reproduces SHA-1 52e5024e...
  flags: "-proc arm946e -nostdlib -interworking -nodead -map closure,unused -msgstyle gcc"
